services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: smartclinic
      POSTGRES_USER: smartclinic
      POSTGRES_PASSWORD: smartclinic
    ports: ["5432:5432"]
    volumes: ["clinic-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartclinic -d smartclinic"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: ./backend
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/smartclinic
      DB_USERNAME: smartclinic
      DB_PASSWORD: smartclinic
    ports: ["8080:8080"]
    depends_on:
      db: {condition: service_healthy}
  web:
    build: ./frontend
    ports: ["5173:80"]
    depends_on: [api]
volumes:
  clinic-data:
