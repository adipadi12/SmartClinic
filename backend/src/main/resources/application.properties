spring.application.name=smartclinic-api
server.port=${PORT:8080}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/smartclinic}
spring.datasource.username=${DB_USERNAME:smartclinic}
spring.datasource.password=${DB_PASSWORD:smartclinic}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
app.jwt.secret=${JWT_SECRET:local-development-secret-key-please-change-123456789}
app.jwt.expiration-ms=86400000
